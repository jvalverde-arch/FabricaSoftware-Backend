# CI del backend (sprint-00, T-008): compila, prueba y publica las imágenes de los dos hosts.
# Las pruebas de integración levantan Postgres con Testcontainers, que usa el Docker del runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SoftwareFactory.sln

      # Directory.Build.props treats warnings as errors, so a style or analyzer finding fails here.
      - name: Build
        run: dotnet build SoftwareFactory.sln -c Release --no-restore

      # Unit tests plus integration tests against a throw-away PostgreSQL (Testcontainers). The tests marked
      # Category=RealEndpoint stay out: tests.runsettings excludes them because they need credentials and money.
      - name: Test
        run: dotnet test SoftwareFactory.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  images:
    name: Publish images
    # Only what already passed the tests, and only from the trunk: a pull request never publishes.
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: softwarefactory-api
            dockerfile: Dockerfile.api
          - image: softwarefactory-agentruntime
            dockerfile: Dockerfile.agentruntime
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versioned tags: the commit (immutable), the branch (moving), and a running number for humans.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=main
            type=raw,value=0.1.${{ github.run_number }}

      # Se construye y se carga en el Docker del runner: nada se publica antes de que el guardián la revise.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Guardián de secretos (estandar-backend.md §7): se comprueba la imagen, no la confianza en el .dockerignore.
      # Las primeras imágenes publicadas llevaban dentro appsettings.Local.json; esto es lo que impide que se repita.
      - name: Assert no secrets in the image
        run: ./.github/scripts/assert-no-secrets-in-image.sh ${{ matrix.image }}:candidate

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag ${{ matrix.image }}:candidate "$tag"
            docker push "$tag"
          done
